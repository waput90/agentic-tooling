<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm action</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, 'Segoe UI', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: #edf2ef;
        background: radial-gradient(circle at 88% 0%, #244435 0, #171f1c 36%, #101215 72%);
      }
      .dialog {
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding: 28px 32px 26px;
        border: 1px solid #3c4a43;
        border-radius: 16px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #b8c6bd;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: #b7efc5;
        color: #113321;
        font-size: 17px;
        letter-spacing: 0;
      }
      .close {
        border: 0;
        border-radius: 9px;
        width: 32px;
        height: 32px;
        color: #b8c6bd;
        background: transparent;
        cursor: pointer;
        font-size: 24px;
        line-height: 1;
      }
      .close:hover,
      .close:focus-visible {
        background: #303b34;
        color: white;
      }
      .eyebrow {
        margin: 32px 0 8px;
        color: #a6e8b7;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 27px;
        line-height: 1.2;
        letter-spacing: -0.035em;
        overflow-wrap: anywhere;
      }
      .detail {
        flex: 1;
        overflow: auto;
        margin: 18px 0 0;
        padding-right: 8px;
        color: #b8c3bc;
        font-size: 14px;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-top: 19px;
        border-top: 1px solid #39443e;
      }
      .hint {
        color: #8e9c92;
        font-size: 12px;
      }
      .buttons {
        display: flex;
        gap: 10px;
      }
      button {
        font: inherit;
      }
      .button {
        min-width: 100px;
        min-height: 39px;
        padding: 9px 16px;
        border: 1px solid #54655a;
        border-radius: 9px;
        color: #edf2ef;
        background: #222b25;
        cursor: pointer;
        font-size: 13px;
        font-weight: 650;
      }
      .button:hover {
        background: #303c33;
      }
      .button.primary {
        border-color: #b7efc5;
        color: #122a1a;
        background: #b7efc5;
      }
      .button.primary:hover {
        background: #d1f7da;
      }
      .button.destructive {
        border-color: #f4a49d;
        color: #33140f;
        background: #f4a49d;
      }
      .button.destructive:hover {
        background: #ffc0b8;
      }
      button:focus-visible {
        outline: 2px solid white;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main
      class="dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="title"
      aria-describedby="detail"
    >
      <div class="top">
        <div class="brand"><span class="mark">✓</span> Agentic Tooling</div>
        <button id="close" class="close" type="button" aria-label="Cancel and close">×</button>
      </div>
      <p class="eyebrow">Your confirmation is needed</p>
      <h1 id="title">Confirm action</h1>
      <p id="detail" class="detail"></p>
      <div class="footer">
        <span class="hint">Escape cancels this action</span>
        <div class="buttons">
          <button id="cancel" class="button" type="button" autofocus>Cancel</button
          ><button id="action" class="button primary" type="button">Continue</button>
        </div>
      </div>
    </main>
  </body>
</html>
